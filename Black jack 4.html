<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Casino</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #176b45 0%, #0b3d2a 45%, #061f16 100%);
      color: white;
      overflow-x: hidden;
    }

    .game {
      width: min(1200px, 95%);
      margin: auto;
      padding: 25px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: clamp(32px, 6vw, 58px);
      letter-spacing: 4px;
      text-shadow: 0 4px 15px rgba(0,0,0,.5);
    }

    header p {
      opacity: .75;
      margin-top: 5px;
    }

    .stack-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .stack-box {
      text-align: center;
    }

    .stack-box h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: .7;
      margin-bottom: 8px;
    }

    .chips {
      min-height: 85px;
      min-width: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    .chip-stack {
      position: relative;
      width: 80px;
      height: 75px;
    }

    .chip {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      position: absolute;
      left: 11px;
      border: 4px dashed rgba(255,255,255,.8);
      box-shadow:
        0 5px 0 rgba(0,0,0,.3),
        inset 0 0 0 3px rgba(0,0,0,.15);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 0 1px 2px black;
    }

    .chip-5 { background: #e33; }
    .chip-25 { background: #2777e8; }
    .chip-100 { background: #171717; }
    .chip-500 { background: #8e35c7; }

    .stack-value {
      font-size: 25px;
      font-weight: 800;
    }

    .bet-value {
      font-size: 22px;
      color: #ffd45a;
      font-weight: bold;
    }

    .table {
      position: relative;
      background:
        radial-gradient(ellipse at center, #16834f 0%, #0d633c 60%, #09462d 100%);
      border: 8px solid #5d321d;
      border-radius: 45px;
      min-height: 620px;
      padding: 30px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        inset 0 0 50px rgba(0,0,0,.2);
      overflow: hidden;
    }

    .table::before {
      content: "";
      position: absolute;
      inset: 15px;
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 32px;
      pointer-events: none;
    }

    .section {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 30px;
    }

    .section h2 {
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 12px;
      opacity: .8;
    }

    .cards {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 110px;
    }

    .card {
      width: 72px;
      height: 100px;
      background: white;
      color: #111;
      border-radius: 9px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 7px 15px rgba(0,0,0,.35);
      animation: cardIn .25s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(-25px) rotate(-4deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotate(0);
      }
    }

    .card.red {
      color: #d71919;
    }

    .card .rank {
      font-size: 22px;
      font-weight: 900;
    }

    .card .suit {
      font-size: 31px;
      text-align: center;
      line-height: 1;
    }

    .hidden-card {
      background:
        repeating-linear-gradient(
          45deg,
          #a71919,
          #a71919 6px,
          #e1c27b 6px,
          #e1c27b 10px
        );
      border: 4px solid white;
    }

    .hands {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .hand {
      min-width: 260px;
      padding: 14px;
      border-radius: 18px;
      border: 2px solid transparent;
      transition: .2s;
    }

    .hand.active {
      border-color: #ffd45a;
      background: rgba(255,212,90,.08);
      box-shadow: 0 0 25px rgba(255,212,90,.15);
    }

    .hand-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .hand-score {
      font-size: 16px;
      margin-top: 7px;
      opacity: .8;
    }

    .result {
      min-height: 38px;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      margin: 10px 0 15px;
    }

    .result.win { color: #6dff9c; }
    .result.lose { color: #ff6969; }
    .result.push { color: #ffe08a; }

    .controls,
    .bet-buttons {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: #17202a;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,.25);
      transition: .15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,.25);
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .primary { background: #d49b17; }
    .danger { background: #a52b2b; }
    .split { background: #6f38a8; }
    .double { background: #bd671d; }

    .betting {
      position: relative;
      z-index: 5;
      margin-top: 20px;
      text-align: center;
    }

    .betting h3 {
      margin-bottom: 10px;
      opacity: .8;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .bet-chip {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 0;
      border: 4px dashed rgba(255,255,255,.8);
      box-shadow: 0 5px 0 rgba(0,0,0,.3);
    }

    .bet-chip.five { background: #e33; }
    .bet-chip.twentyfive { background: #2777e8; }
    .bet-chip.hundred { background: #171717; }
    .bet-chip.fivehundred { background: #8e35c7; }

    .bet-info {
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .game {
        width: 97%;
        padding-top: 12px;
      }

      .table {
        padding: 22px 10px;
        border-width: 5px;
        border-radius: 28px;
      }

      .card {
        width: 59px;
        height: 84px;
      }

      .card .rank {
        font-size: 18px;
      }

      .card .suit {
        font-size: 25px;
      }

      .hand {
        min-width: 100%;
      }

      .controls button {
        flex: 1 1 42%;
      }
    }
  </style>
</head>

<body>

<div class="game">

  <header>
    <h1>BLACKJACK</h1>
    <p>Virtuelle chips • Dealer står på 17</p>
  </header>

  <div class="stack-area">

    <div class="stack-box">
      <h3>Din chip stack</h3>
      <div class="chips" id="stackVisual"></div>
      <div class="stack-value" id="balance">1000 chips</div>
    </div>

    <div class="stack-box">
      <h3>Innsats</h3>
      <div class="chips" id="betVisual"></div>
      <div class="bet-value" id="betAmount">0 chips</div>
    </div>

  </div>

  <div class="table">

    <div class="section">
      <h2>Dealer</h2>

      <div class="cards" id="dealerCards"></div>

      <div class="hand-score" id="dealerScore">-</div>
    </div>

    <div class="section">

      <h2>Spiller</h2>

      <div class="hands" id="playerHands"></div>

    </div>

    <div class="result" id="result"></div>

    <div class="controls">

      <button class="primary" id="dealBtn">
        DEAL
      </button>

      <button id="hitBtn" disabled>
        HIT
      </button>

      <button id="standBtn" disabled>
        STAND
      </button>

      <button class="double" id="doubleBtn" disabled>
        DOUBLE
      </button>

      <button class="split" id="splitBtn" disabled>
        SPLIT
      </button>

      <button class="danger" id="clearBtn">
        CLEAR BET
      </button>

    </div>

    <div class="betting">

      <h3>Velg innsats</h3>

      <div class="bet-buttons">

        <button class="bet-chip five" data-value="5">5</button>
        <button class="bet-chip twentyfive" data-value="25">25</button>
        <button class="bet-chip hundred" data-value="100">100</button>
        <button class="bet-chip fivehundred" data-value="500">500</button>

      </div>

      <div class="bet-info">
        Innsats: <span id="betText">0</span> chips
      </div>

    </div>

  </div>

</div>


<script>

const suits = [
  { symbol: "♠", red: false },
  { symbol: "♥", red: true },
  { symbol: "♦", red: true },
  { symbol: "♣", red: false }
];

const ranks = [
  { name: "A", value: 11 },
  { name: "2", value: 2 },
  { name: "3", value: 3 },
  { name: "4", value: 4 },
  { name: "5", value: 5 },
  { name: "6", value: 6 },
  { name: "7", value: 7 },
  { name: "8", value: 8 },
  { name: "9", value: 9 },
  { name: "10", value: 10 },
  { name: "J", value: 10 },
  { name: "Q", value: 10 },
  { name: "K", value: 10 }
];

let deck = [];
let balance = 1000;
let currentBet = 0;

let dealerHand = [];
let playerHands = [];

let activeHand = 0;
let gameStarted = false;
let roundOver = false;
let dealerHidden = true;


/* =========================
   DECK
========================= */

function createDeck() {

  deck = [];

  for (const suit of suits) {

    for (const rank of ranks) {

      deck.push({
        suit: suit.symbol,
        red: suit.red,
        name: rank.name,
        value: rank.value
      });

    }
  }

  shuffle(deck);
}


function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
      [array[j], array[i]];
  }
}


function drawCard() {

  if (deck.length === 0) {
    createDeck();
  }

  return deck.pop();
}


/* =========================
   HAND VALUE
========================= */

function handValue(hand) {

  let total = 0;
  let aces = 0;

  for (const card of hand) {

    total += card.value;

    if (card.name === "A") {
      aces++;
    }
  }

  while (total > 21 && aces > 0) {

    total -= 10;
    aces--;

  }

  return total;
}


function isBlackjack(hand) {

  return hand.length === 2 &&
         handValue(hand) === 21;
}


function canSplitHand(hand) {

  if (hand.length !== 2) {
    return false;
  }

  return hand[0].value === hand[1].value;
}


/* =========================
   CHIPS
========================= */

function renderChipStack(amount, element) {

  element.innerHTML = "";

  if (amount <= 0) {
    return;
  }

  const values = [500, 100, 25, 5];

  let remaining = amount;
  let chips = [];

  for (const value of values) {

    while (remaining >= value && chips.length < 6) {

      chips.push(value);
      remaining -= value;

    }
  }

  chips.reverse();

  chips.forEach((value, index) => {

    const chip = document.createElement("div");

    chip.className = `chip chip-${value}`;
    chip.textContent = value;

    chip.style.bottom =
      `${index * 7}px`;

    element.appendChild(chip);

  });
}


function updateMoneyUI() {

  document.getElementById("balance").textContent =
    `${balance} chips`;

  document.getElementById("betAmount").textContent =
    `${currentBet} chips`;

  document.getElementById("betText").textContent =
    currentBet;

  renderChipStack(
    balance,
    document.getElementById("stackVisual")
  );

  renderChipStack(
    currentBet,
    document.getElementById("betVisual")
  );
}


/* =========================
   CARDS
========================= */

function createCardHTML(card, hidden = false) {

  if (hidden) {

    return `
      <div class="card hidden-card"></div>
    `;

  }

  return `
    <div class="card ${card.red ? "red" : ""}">
      <div class="rank">${card.name}</div>
      <div class="suit">${card.suit}</div>
      <div class="rank">${card.name}</div>
    </div>
  `;
}


/* =========================
   RENDER
========================= */

function renderGame() {

  const dealerCards =
    document.getElementById("dealerCards");

  dealerCards.innerHTML = "";

  dealerHand.forEach((card, index) => {

    dealerCards.innerHTML +=
      createCardHTML(
        card,
        dealerHidden && index === 1
      );

  });


  document.getElementById("dealerScore").textContent =
    dealerHidden
      ? dealerHand.length
        ? `${handValue([dealerHand[0]])} + ?`
        : "-"
      : handValue(dealerHand);


  const handsContainer =
    document.getElementById("playerHands");

  handsContainer.innerHTML = "";


  playerHands.forEach((hand, index) => {

    const handDiv =
      document.createElement("div");

    handDiv.className =
      `hand ${
        index === activeHand &&
        gameStarted &&
        !roundOver
          ? "active"
          : ""
      }`;


    const score =
      handValue(hand.cards);


    handDiv.innerHTML = `
      <div class="hand-title">
        Hånd ${index + 1}
        ${
          index === activeHand &&
          gameStarted &&
          !roundOver
            ? " ← DIN TUR"
            : ""
        }
      </div>

      <div class="cards">
        ${hand.cards
          .map(card => createCardHTML(card))
          .join("")}
      </div>

      <div class="hand-score">
        ${
          score > 21
            ? "BUST!"
            : `Poeng: ${score}`
        }
      </div>
    `;

    handsContainer.appendChild(handDiv);

  });


  updateButtons();
}


/* =========================
   BETTING
========================= */

document
  .querySelectorAll(".bet-chip")
  .forEach(button => {

    button.addEventListener("click", () => {

      if (gameStarted) {
        return;
      }

      const value =
        Number(button.dataset.value);


      if (balance >= value) {

        balance -= value;
        currentBet += value;

        updateMoneyUI();
        updateButtons();

      }

    });

  });


document
  .getElementById("clearBtn")
  .addEventListener("click", () => {

    if (gameStarted) {
      return;
    }

    balance += currentBet;
    currentBet = 0;

    updateMoneyUI();
    updateButtons();

  });


/* =========================
   START ROUND
========================= */

document
  .getElementById("dealBtn")
  .addEventListener("click", startGame);


function startGame() {

  if (gameStarted) {
    return;
  }

  if (currentBet <= 0) {

    showResult(
      "Velg en innsats først!",
      "push"
    );

    return;
  }


  createDeck();


  dealerHand = [
    drawCard(),
    drawCard()
  ];


  playerHands = [
    {
      cards: [
        drawCard(),
        drawCard()
      ],
      bet: currentBet,
      finished: false
    }
  ];


  /*
    Bet is now attached to the hand.
    currentBet becomes 0 because the
    chips are already on the table.
  */

  currentBet = 0;

  activeHand = 0;
  gameStarted = true;
  roundOver = false;
  dealerHidden = true;


  document.getElementById("result").textContent = "";


  updateMoneyUI();
  renderGame();


  /* NATURAL BLACKJACK */

  if (isBlackjack(playerHands[0].cards)) {

    setTimeout(() => {

      dealerHidden = false;

      renderGame();

      setTimeout(() => {

        if (isBlackjack(dealerHand)) {

          finishRound();

        } else {

          blackjackWin();

        }

      }, 500);

    }, 500);

  }

}


/* =========================
   HIT
========================= */

document
  .getElementById("hitBtn")
  .addEventListener("click", () => {

    if (!gameStarted || roundOver) {
      return;
    }


    const hand =
      playerHands[activeHand];


    hand.cards.push(drawCard());


    const score =
      handValue(hand.cards);


    if (score >= 21) {

      hand.finished = true;

      moveToNextHand();

    } else {

      renderGame();

    }

  });


/* =========================
   STAND
========================= */

document
  .getElementById("standBtn")
  .addEventListener("click", () => {

    if (!gameStarted || roundOver) {
      return;
    }

    playerHands[activeHand].finished = true;

    moveToNextHand();

  });


/* =========================
   DOUBLE
========================= */

document
  .getElementById("doubleBtn")
  .addEventListener("click", () => {

    if (!gameStarted || roundOver) {
      return;
    }


    const hand =
      playerHands[activeHand];


    if (hand.cards.length !== 2) {
      return;
    }


    if (balance < hand.bet) {

      showResult(
        "Ikke nok chips til Double Down.",
        "lose"
      );

      return;
    }


    balance -= hand.bet;

    hand.bet *= 2;

    hand.cards.push(drawCard());

    hand.finished = true;


    updateMoneyUI();


    moveToNextHand();

  });


/* =========================
   SPLIT
========================= */

document
  .getElementById("splitBtn")
  .addEventListener("click", () => {

    if (!gameStarted || roundOver) {
      return;
    }


    const hand =
      playerHands[activeHand];


    if (!canSplitHand(hand.cards)) {
      return;
    }


    if (balance < hand.bet) {

      showResult(
        "Ikke nok chips til Split.",
        "lose"
      );

      return;
    }


    const bet = hand.bet;

    balance -= bet;


    const firstCard =
      hand.cards[0];

    const secondCard =
      hand.cards[1];


    playerHands.splice(

      activeHand,

      1,

      {
        cards: [
          firstCard,
          drawCard()
        ],
        bet: bet,
        finished: false
      },

      {
        cards: [
          secondCard,
          drawCard()
        ],
        bet: bet,
        finished: false
      }

    );


    updateMoneyUI();
    renderGame();

  });


/* =========================
   NEXT HAND
========================= */

function moveToNextHand() {

  for (
    let i = activeHand + 1;
    i < playerHands.length;
    i++
  ) {

    if (!playerHands[i].finished) {

      activeHand = i;

      renderGame();

      return;
    }

  }


  dealerPlay();
}


/* =========================
   DEALER
========================= */

function dealerPlay() {

  dealerHidden = false;

  renderGame();


  setTimeout(() => {

    function dealerStep() {

      if (handValue(dealerHand) < 17) {

        dealerHand.push(drawCard());

        renderGame();

        setTimeout(
          dealerStep,
          500
        );

      } else {

        setTimeout(
          finishRound,
          400
        );

      }

    }

    dealerStep();

  }, 500);

}


/* =========================
   FINISH ROUND
========================= */

function finishRound() {

  if (roundOver) {
    return;
  }


  roundOver = true;
  gameStarted = false;
  dealerHidden = false;


  const dealerScore =
    handValue(dealerHand);


  let totalPayout = 0;

  let wins = 0;
  let losses = 0;
  let pushes = 0;


  playerHands.forEach(hand => {

    const playerScore =
      handValue(hand.cards);


    /* Player bust */

    if (playerScore > 21) {

      losses++;

      return;
    }


    /* Dealer bust */

    if (dealerScore > 21) {

      totalPayout += hand.bet * 2;

      wins++;

      return;
    }


    /* Player wins */

    if (playerScore > dealerScore) {

      totalPayout += hand.bet * 2;

      wins++;

      return;
    }


    /* Push */

    if (playerScore === dealerScore) {

      totalPayout += hand.bet;

      pushes++;

      return;
    }


    /* Dealer wins */

    losses++;

  });


  balance += totalPayout;


  /*
    IMPORTANT:
    currentBet is already 0.
    This means the next round can
    freely create a new bet.
  */

  currentBet = 0;


  updateMoneyUI();
  renderGame();


  if (wins > 0 && losses === 0) {

    showResult(
      `DU VANT! +${totalPayout} chips`,
      "win"
    );

  } else if (
    losses > 0 &&
    wins === 0 &&
    pushes === 0
  ) {

    showResult(
      "DU TAPTE RUNDA",
      "lose"
    );

  } else if (
    pushes > 0 &&
    wins === 0 &&
    losses === 0
  ) {

    showResult(
      "PUSH — INNSATSEN ER TILBAKE",
      "push"
    );

  } else {

    showResult(
      "RUNDE FERDIG",
      "push"
    );

  }


  /*
    Clear the old hands after a short delay,
    so the result is visible.
  */

  setTimeout(() => {

    if (!gameStarted) {

      dealerHand = [];
      playerHands = [];
      activeHand = 0;
      dealerHidden = true;

      renderGame();

      updateButtons();

    }

  }, 1800);

}


/* =========================
   BLACKJACK
========================= */

function blackjackWin() {

  if (roundOver) {
    return;
  }


  roundOver = true;
  gameStarted = false;


  const bet =
    playerHands[0].bet;


  /*
    Original bet was already removed.
    Blackjack pays 3:2 profit,
    plus the original bet.
  */

  const profit =
    Math.floor(bet * 1.5);


  const payout =
    bet + profit;


  balance += payout;


  currentBet = 0;


  updateMoneyUI();
  renderGame();


  showResult(
    `BLACKJACK! +${profit} chips`,
    "win"
  );


  setTimeout(() => {

    dealerHand = [];
    playerHands = [];
    activeHand = 0;
    dealerHidden = true;

    renderGame();
    updateButtons();

  }, 1800);

}


/* =========================
   RESULT
========================= */

function showResult(text, type) {

  const result =
    document.getElementById("result");

  result.textContent = text;

  result.className =
    `result ${type}`;

}


/* =========================
   BUTTON STATES
========================= */

function updateButtons() {

  const dealBtn =
    document.getElementById("dealBtn");

  const hitBtn =
    document.getElementById("hitBtn");

  const standBtn =
    document.getElementById("standBtn");

  const doubleBtn =
    document.getElementById("doubleBtn");

  const splitBtn =
    document.getElementById("splitBtn");

  const clearBtn =
    document.getElementById("clearBtn");


  /*
    DEAL is available whenever:
    - no game is running
    - there is an active bet
  */

  dealBtn.disabled =
    gameStarted ||
    currentBet <= 0;


  hitBtn.disabled =
    !gameStarted ||
    roundOver ||
    !playerHands[activeHand];


  standBtn.disabled =
    !gameStarted ||
    roundOver ||
    !playerHands[activeHand];


  doubleBtn.disabled =
    !gameStarted ||
    roundOver ||
    !playerHands[activeHand] ||
    playerHands[activeHand].cards.length !== 2 ||
    balance < playerHands[activeHand].bet;


  splitBtn.disabled =
    !gameStarted ||
    roundOver ||
    !playerHands[activeHand] ||
    !canSplitHand(playerHands[activeHand].cards) ||
    balance < playerHands[activeHand].bet;


  clearBtn.disabled =
    gameStarted ||
    currentBet <= 0;


  document
    .querySelectorAll(".bet-chip")
    .forEach(button => {

      button.disabled =
        gameStarted ||
        balance <
        Number(button.dataset.value);

    });

}


/* =========================
   INITIALIZE
========================= */

createDeck();

updateMoneyUI();

renderGame();

updateButtons();

</script>

</body>
